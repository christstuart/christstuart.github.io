<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Game Web Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Unity Game Web Interface</h1>

    <!-- Objective Section -->
    <section id="objective-section">
        <h2>Current Objective</h2>
        <p id="objective-text">Press "Start Scenario" to begin.</p>
        <button id="complete-objective-btn" disabled>Complete Objective</button>
    </section>

    <!-- Timer Display -->
    <section id="timer-section">
        <h2>Time Remaining: <span id="time-remaining">--</span> s</h2>
    </section>

    <!-- Store Section -->
    <section id="store-section">
        <h2>Store</h2>
        <p>Currency: <span id="player-currency">0</span></p>
        <div id="store-items"></div>
    </section>

    <!-- Customization Section -->
    <section id="customization-section">
        <h2>Customization</h2>
        <div class="preview">
            <div>
                <h3>Avatar</h3>
                <img id="avatar-preview" src="" alt="Avatar Preview" />
            </div>
            <div>
                <h3>Vehicle</h3>
                <img id="vehicle-preview" src="" alt="Vehicle Preview" />
            </div>
        </div>
    </section>

    <!-- Tutorial Panel -->
    <div id="tutorial-panel" class="hidden">
        <div class="tutorial-content">
            <p id="tutorial-text"></p>
            <button id="next-tutorial-btn">Next</button>
        </div>
    </div>

    <!-- Control Buttons -->
    <section id="controls-section">
        <button id="start-scenario-btn">Start Scenario</button>
    </section>

    <!-- Audio Elements for Music -->
    <audio id="music-audio" loop></audio>

    <script src="main.js"></script>
</body>
</html>
